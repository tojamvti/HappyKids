# Publikacja strony HappyKids na GitHub Pages.
# Uruchamia się sama po każdej zmianie (np. wgraniu zdjęć do folderu galeria/).
name: Publikacja strony

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publikacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pełna historia: kolejność zdjęć wg daty wgrania

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Przygotowanie zdjęć i strony
        run: |
          pip install --quiet pillow pillow-heif
          python .github/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
